name: Project quality checks

on:
  push:
    branches:
      - work/myryadom-improvements
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check audit script syntax
        run: node --check tests/audit.mjs
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check admin.js
          node --check lesson-builder.js
          node --check lesson-library.js
          node --check lesson-library-canonical.js
          node --check sw.js
      - name: Validate PWA and project consistency
        run: node tests/audit.mjs
